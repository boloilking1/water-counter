<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Genera Icona Miele</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #18181b;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    canvas {
      width: 180px;
      height: 180px;
      border-radius: 40px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    button {
      margin-top: 24px;
      padding: 14px 28px;
      font-size: 15px;
      font-weight: 700;
      color: #0f172a;
      background: #38bdf8;
      border: none;
      border-radius: 9999px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(56,189,248,0.3);
      transition: transform 0.1s ease;
    }
    button:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body>
  <canvas id="c" width="512" height="512"></canvas>
  <button onclick="download()">Scarica apple-touch-icon.png (HD)</button>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');

    // 1. Sfondo gradiente Miele / Ambra
    const bg = ctx.createLinearGradient(0, 0, 512, 512);
    bg.addColorStop(0, '#FFFBEB');
    bg.addColorStop(0.5, '#FEF3C7');
    bg.addColorStop(1, '#FDE68A');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, 512, 512);

    function drawHex(x, y, r, fill, stroke, width = 3) {
      ctx.save();
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const a = (Math.PI / 3) * i - Math.PI / 6;
        const px = x + r * Math.cos(a);
        const py = y + r * Math.sin(a);
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      if (fill) { ctx.fillStyle = fill; ctx.fill(); }
      if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = width; ctx.stroke(); }
      ctx.restore();
    }

    // 2. Trama Honeycomb ad alveare
    const hexRadius = 52;
    const dx = hexRadius * Math.sqrt(3);
    const dy = hexRadius * 1.5;

    for (let row = -1; row <= 7; row++) {
      for (let col = -1; col <= 7; col++) {
        const hx = col * dx + (row % 2 ? dx / 2 : 0);
        const hy = row * dy;
        drawHex(hx, hy, hexRadius - 6, '#FEF9C3', '#F59E0B', 2);
      }
    }

    // 3. Piatto esagonale bianco centrale con ombra
    ctx.save();
    ctx.shadowColor = 'rgba(217, 119, 6, 0.3)';
    ctx.shadowBlur = 36;
    ctx.shadowOffsetY = 16;
    drawHex(256, 256, 155, '#FFFFFF', '#F59E0B', 5);
    ctx.restore();

    drawHex(256, 256, 138, null, '#FDE68A', 3);

    // 4. Goccia d'acqua elegante
    ctx.save();
    ctx.translate(256, 250);

    ctx.shadowColor = 'rgba(2, 132, 199, 0.45)';
    ctx.shadowBlur = 28;
    ctx.shadowOffsetY = 16;

    ctx.beginPath();
    ctx.moveTo(0, -125);
    ctx.bezierCurveTo(45, -45, 90, 20, 90, 75);
    ctx.bezierCurveTo(90, 126, 50, 158, 0, 158);
    ctx.bezierCurveTo(-50, 158, -90, 126, -90, 75);
    ctx.bezierCurveTo(-90, 20, -45, -45, 0, -125);
    ctx.closePath();

    const dropGrad = ctx.createLinearGradient(0, -125, 0, 158);
    dropGrad.addColorStop(0, '#38BDF8');
    dropGrad.addColorStop(0.4, '#0EA5E9');
    dropGrad.addColorStop(1, '#0284C7');
    ctx.fillStyle = dropGrad;
    ctx.fill();

    ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
    ctx.lineWidth = 3;
    ctx.stroke();

    // Bagliore interno caustico
    const innerGlow = ctx.createRadialGradient(0, 115, 10, 0, 115, 60);
    innerGlow.addColorStop(0, 'rgba(186, 230, 253, 0.7)');
    innerGlow.addColorStop(1, 'rgba(14, 165, 233, 0)');
    ctx.fillStyle = innerGlow;
    ctx.fill();

    // Riflesso vitreo curvo
    ctx.beginPath();
    ctx.ellipse(-32, 25, 14, 46, -Math.PI / 6, 0, Math.PI * 2);
    const specGrad = ctx.createLinearGradient(-45, -15, -20, 65);
    specGrad.addColorStop(0, 'rgba(255, 255, 255, 0.85)');
    specGrad.addColorStop(0.6, 'rgba(255, 255, 255, 0.35)');
    specGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
    ctx.fillStyle = specGrad;
    ctx.fill();

    // Scintilla superiore
    ctx.beginPath();
    ctx.arc(0, -95, 3.5, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
    ctx.fill();

    ctx.restore();

    function download() {
      const out = document.createElement('canvas');
      out.width = 180;
      out.height = 180;
      const octx = out.getContext('2d');
      octx.imageSmoothingQuality = 'high';
      octx.drawImage(canvas, 0, 0, 180, 180);

      const a = document.createElement('a');
      a.download = 'apple-touch-icon.png';
      a.href = out.toDataURL('image/png');
      a.click();
    }
  </script>
</body>
</html>
